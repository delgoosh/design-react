name: slowcook brew — auto on tests + mockup merged

# 0.16.0-alpha.10 — gated dispatcher.
#
# Fires when EITHER a tests PR (label `slowcook-tests`) OR a mockup
# PR (label `slowcook-mockup`) merges to main. For each story id
# mentioned in the merging PR's title:
#
#   1. Looks up whether the OTHER half is also merged on main.
#   2. If yes → dispatches slowcook-brew.yml with mode=plate (mock
#      present). 0.17.0+ removed the legacy fallback — mock is mandatory.
#   3. If no  → posts a "waiting for the other half" notice and exits;
#      the next merge of the missing half re-fires this workflow,
#      which finds both halves and dispatches.
#
# This keeps consumers from having to coordinate the merge order, and
# gives the PM a clear signal in CI logs about which half is missing
# when brew doesn't fire.
#
# slowcook-brew.yml is consumer-maintained today; for plate-mode runs
# it should invoke `slowcook port --story \$STORY_ID` BEFORE `slowcook
# brew` so the deterministic mock → src copy lands first. See
# docs/operating-guide.md#brew-workflow-changes-for-016 for the
# snippet.

on:
  pull_request:
    types: [closed]

jobs:
  trigger:
    if: >-
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'slowcook-tests') ||
        contains(github.event.pull_request.labels.*.name, 'slowcook-mockup')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Extract story ids + label kind
        id: parse
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -eu
          # Story ids: prefer branch name (slowcook/{kind}/story-N is unambiguous),
          # fall back to title scan.
          BRANCH_IDS=$(printf '%s\n' "$BRANCH" | grep -oE 'story-[a-zA-Z0-9_-]+' | sed 's/story-//' | sort -u | tr '\n' ' ' || true)
          TITLE_IDS=$(printf '%s\n' "$TITLE"  | grep -oE 'story-[a-zA-Z0-9_-]+' | sed 's/story-//' | sort -u | tr '\n' ' ' || true)
          if [ -n "$BRANCH_IDS" ]; then
            IDS="$BRANCH_IDS"
          else
            IDS="$TITLE_IDS"
          fi
          if [ -z "$IDS" ]; then
            echo "::notice::No story ids found in PR title or branch — skipping auto-brew."
          fi
          # Which kind merged? mockup or tests.
          if printf '%s' "$LABELS" | grep -q 'slowcook-mockup'; then
            KIND="mockup"
          else
            KIND="tests"
          fi
          echo "story_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Per-story gate + dispatch
        if: steps.parse.outputs.story_ids != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ steps.parse.outputs.kind }}
        run: |
          set -eu
          for id in ${{ steps.parse.outputs.story_ids }}; do
            echo "── story-$id (this merge: $KIND) ──"

            # 0.16.0-α.25 — look up the OTHER kind's merged PR by title +
            # label, NOT by branch name. Tests PRs use batch-N branches
            # (slowcook/tests/batch-1234567890) but their titles always
            # carry "story-N" + the slowcook-tests label. Mockup PRs
            # use slowcook/mockup/story-N branches AND mockup: story-N
            # titles + slowcook-mockup label. Title+label is the
            # robust intersection.
            if [ "$KIND" = "mockup" ]; then
              OTHER_LABEL="slowcook-tests"
            else
              OTHER_LABEL="slowcook-mockup"
            fi

            OTHER_MERGED=$(gh pr list \
              --repo ${{ github.repository }} \
              --state merged \
              --label "$OTHER_LABEL" \
              --json number,title \
              --jq "[.[] | select(.title | contains(\"story-$id\"))] | length" \
              || echo "0")

            if [ "$OTHER_MERGED" -ge 1 ]; then
              MODE="plate"
              # 0.18 — recon gate. Run slowcook recon first; brew dispatches
              # only when recon exits 0 (clean) OR 1 (rename_needed —
              # advisory). Exit 2 (escalate) means structural gaps brew
              # CANNOT fix without upstream intervention; in that case we
              # post a comment + skip dispatch. Recon writes
              # .brewing/recon-result.json + emits shape tests as a side
              # effect (mock files persist on the mockup branch but won't
              # cascade to a brew commit because brew dispatch is skipped).
              echo "Both halves merged for story-$id; running recon before brew dispatch."
              if npx --yes "$SLOWCOOK_CLI" recon --story "$id"; then
                echo "Recon clean; dispatching brew (mode=$MODE)."
                gh workflow run slowcook-brew.yml \
                  --repo ${{ github.repository }} \
                  -f story_id=$id \
                  -f budget_usd=10 \
                  -f max_iterations=10 \
                  -f model=claude-sonnet-4-6 \
                  -f mode=$MODE || true
              else
                RECON_EXIT=$?
                if [ "$RECON_EXIT" = "2" ]; then
                  echo "::warning::Recon escalated (exit 2) for story-$id; brew NOT dispatched. PM should resolve before retry."
                  ISSUE_NUM=$(gh pr list --repo ${{ github.repository }} --search "story-$id" --state merged --json body --jq '[.[] | select(.body | match("#[0-9]+"))] | first | .body | match("#([0-9]+)") | .captures[0].string' || echo "")
                  if [ -n "$ISSUE_NUM" ]; then
                    gh issue comment "$ISSUE_NUM" --repo ${{ github.repository }} \
                      --body "🛑 **brew-auto: recon gate failed (exit 2)** for story-$id. See `.brewing/recon-result.json` on the merged tests PR. Resolve the structural gap (typically: rename + dispatch testgen --regenerate, or amend the spec) then re-trigger by re-merging or re-running this workflow." || true
                  fi
                else
                  echo "::warning::Recon failed unexpectedly (exit $RECON_EXIT) for story-$id; brew NOT dispatched."
                fi
              fi
            else
              # 0.17.0 — brew NEVER runs without a mock + PM-reviewed plate
              # amendments. The legacy backend-only fallback is removed —
              # even cron / admin endpoints need a mockup (an API tester
              # page, error states, etc.) so the PM has a reviewable
              # surface before brew commits real code. Stories that
              # genuinely have NO UI at all opt in via explicit
              # `slowcook-no-mock-required` label on the spec PR (rare;
              # not auto-detected here).
              echo "::notice::Waiting for a merged $OTHER_LABEL PR with story-$id in its title before brew can fire. Brew requires a mock + PM-reviewed plate amendments."
            fi
          done
